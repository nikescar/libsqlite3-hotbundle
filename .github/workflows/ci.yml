name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test SQLite3MultipleCiphers
        run: cargo test --features cipher-sqlcipher
      - name: Link release library
        run: cargo build --release --features cipher-sqlcipher
